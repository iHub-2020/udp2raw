# ==============================================================================
# GitHub Actions Workflow: Build and Release udp2raw
# Author: Reyanmatic (Modified for Auto-Versioning)
# 说明:
# 1. 同时编译 x86_64 和 aarch64 (R2S) 版本。
# 2. 支持 Git Tag 触发 (如 v1.0.0)。
# 3. 支持 手动触发 (Workflow Dispatch)，可输入自定义版本号。
# 4. 自动兜底：如果不输入版本号，自动生成 v0.0.{run_number}。
# 5. 自动清理旧版本，只保留最新的 10 个 Release。
# ==============================================================================

name: Build udp2raw Binaries

on:
  push:
    tags:
      - 'v*' # 当你推送类似 v1.0.0 的 tag 时触发
    branches:
      - master
      - main
  workflow_dispatch: # 允许手动触发
    inputs:
      manual_version:
        description: 'Manual Version (e.g., 1.0.0). Leave empty for auto-gen.'
        required: false
        default: ''

permissions:
  contents: write # 赋予写权限，以便发布 Release 和删除旧版本

jobs:
  build:
    name: Build for ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            compiler: g++
            output_name: udp2raw_x86_64
          - arch: aarch64
            compiler: aarch64-linux-gnu-g++
            output_name: udp2raw_aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            sudo apt-get install -y g++-aarch64-linux-gnu
          fi

      - name: Compile
        run: |
          make clean
          
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            # x86_64 静态编译
            make -j$(nproc) LDFLAGS=-static
            mv udp2raw ${{ matrix.output_name }}
          elif [ "${{ matrix.arch }}" = "aarch64" ]; then
            # aarch64 交叉编译 + 静态链接
            make CROSS=aarch64-linux-gnu- -j$(nproc) LDFLAGS=-static
            mv udp2raw ${{ matrix.output_name }}
          fi
          
          file ${{ matrix.output_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: ${{ matrix.output_name }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine Tag Name
        id: tag
        run: |
          # 逻辑说明:
          # 1. 如果是 Git Tag 推送，直接使用 Tag。
          # 2. 如果是手动触发且输入了版本号，使用输入的版本 (自动补 v)。
          # 3. 其他情况 (Push 或 手动未输入)，使用 v0.0.{run_number}。
          
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "release_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.manual_version }}" != "" ]]; then
            # 处理手动输入的版本号，确保有 v 前缀
            INPUT_VER="${{ inputs.manual_version }}"
            if [[ $INPUT_VER != v* ]]; then INPUT_VER="v$INPUT_VER"; fi
            echo "release_tag=$INPUT_VER" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          else
            # 自动生成版本号
            AUTO_VER="v0.0.${{ github.run_number }}"
            echo "release_tag=$AUTO_VER" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: Release ${{ steps.tag.outputs.release_tag }}
          prerelease: ${{ steps.tag.outputs.is_prerelease }}
          files: |
            artifacts/udp2raw_x86_64/udp2raw_x86_64
            artifacts/udp2raw_aarch64/udp2raw_aarch64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete Older Releases
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 10
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
