# ==============================================================================
# GitHub Actions Workflow: Build and Release udp2raw (Professional Versioning)
# Author: Reyanmatic (Enhanced with Auto-Increment Versioning)
# 说明:
# 1. 同时编译 x86_64 和 aarch64 (R2S) 版本。
# 2. 【核心改进】专业版本管理：从 v1.0.0 开始自动递增版本号
# 3. 支持手动指定版本号，默认自动递增 patch 版本 (+0.0.1)
# 4. 保留所有历史版本，不再覆盖旧版本
# ==============================================================================

name: build-udp2raw-binaries

on:
  push:
    tags:
      - 'v*' 
    branches:
      - master
      - main
  workflow_dispatch: # 允许手动触发
    inputs:
      version:
        description: 'Version number (e.g., 1.2.3, leave empty for auto-increment)'
        required: false
        type: string
      version_bump:
        description: 'Version bump type (when version is empty)'
        required: false
        type: choice
        default: 'patch'
        options:
          - patch  # 默认: +0.0.1
          - minor  # +0.1.0
          - major  # +1.0.0

permissions:
  contents: write # 赋予写权限，以便发布 Release

jobs:
  build:
    name: Build for ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            compiler: g++
            output_name: udp2raw_x86_64
          - arch: aarch64
            compiler: aarch64-linux-gnu-g++
            output_name: udp2raw_aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            sudo apt-get install -y g++-aarch64-linux-gnu
          fi

      - name: Compile
        run: |
          # 清理旧的编译文件
          make clean || true
          
          # 编译 (强制使用静态链接，确保兼容 OpenWrt musl 环境)
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            # x86_64 静态编译
            make -j$(nproc) LDFLAGS=-static
            mv udp2raw ${{ matrix.output_name }}
          elif [ "${{ matrix.arch }}" = "aarch64" ]; then
            # aarch64 交叉编译 + 静态链接
            make CROSS=aarch64-linux-gnu- -j$(nproc) LDFLAGS=-static
            mv udp2raw ${{ matrix.output_name }}
          fi
          
          # 验证文件类型 (打印到日志中以便检查)
          file ${{ matrix.output_name }}
          
          # 验证文件大小 (确保编译成功)
          ls -lh ${{ matrix.output_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: ${{ matrix.output_name }}
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Files
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts -type f -ls
          
          # 确保文件存在且有执行权限
          chmod +x artifacts/udp2raw_x86_64/udp2raw_x86_64 || true
          chmod +x artifacts/udp2raw_aarch64/udp2raw_aarch64 || true

      # 【核心改进】专业版本管理：自动递增版本号
      - name: Determine Version
        id: version
        run: |
          # 如果手动指定了版本号，直接使用
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Using manual version: $VERSION"
          else
            # 获取最新的 release 版本
            LATEST_TAG=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.tag_name // "v0.0.0"')
            echo "Latest tag: $LATEST_TAG"
            
            # 如果没有任何 release，从 v1.0.0 开始
            if [ "$LATEST_TAG" = "null" ] || [ "$LATEST_TAG" = "v0.0.0" ]; then
              VERSION="1.0.0"
              echo "No previous releases found, starting from v1.0.0"
            else
              # 解析版本号 (移除 v 前缀)
              CURRENT_VERSION=${LATEST_TAG#v}
              IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
              
              # 根据 bump 类型递增版本
              BUMP_TYPE="${{ github.event.inputs.version_bump || 'patch' }}"
              case $BUMP_TYPE in
                major)
                  MAJOR=$((MAJOR + 1))
                  MINOR=0
                  PATCH=0
                  ;;
                minor)
                  MINOR=$((MINOR + 1))
                  PATCH=0
                  ;;
                patch|*)
                  PATCH=$((PATCH + 1))
                  ;;
              esac
              
              VERSION="$MAJOR.$MINOR.$PATCH"
              echo "Auto-incremented version ($BUMP_TYPE): $VERSION"
            fi
          fi
          
          echo "release_tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "version_number=$VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=false" >> $GITHUB_OUTPUT
          
          echo "Final version: v$VERSION"

      # 创建新版本 Release（不再覆盖旧版本）
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: udp2raw v${{ steps.version.outputs.version_number }}
          body: |
            ## udp2raw v${{ steps.version.outputs.version_number }}
            
            专业版本发布，支持版本历史追踪。
            
            ### 下载链接
            - `udp2raw_x86_64` - x86_64 架构 (静态编译)
            - `udp2raw_aarch64` - aarch64 架构 (静态编译，适用于 R2S 等设备)
            
            ### 构建信息
            - 版本号: v${{ steps.version.outputs.version_number }}
            - 构建时间: ${{ github.event.head_commit.timestamp }}
            - 提交 SHA: ${{ github.sha }}
            - 触发方式: ${{ github.event_name }}
            
            ### 在 OpenWrt Makefile 中使用
            ```makefile
            # 动态获取最新版本
            PKG_VERSION:=$(shell curl -s https://api.github.com/repos/iHub-2020/udp2raw/releases/latest | grep '"tag_name"' | cut -d'"' -f4 | sed 's/^v//')
            MANUAL_DOWNLOAD_URL:=https://github.com/iHub-2020/udp2raw/releases/download/v$(PKG_VERSION)
            ```
            
            ### 版本历史
            - 所有历史版本都会保留，不再覆盖
            - 支持回滚到任意历史版本
            - 版本号遵循语义化版本控制 (SemVer)
          prerelease: false
          files: |
            artifacts/udp2raw_x86_64/udp2raw_x86_64
            artifacts/udp2raw_aarch64/udp2raw_aarch64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
