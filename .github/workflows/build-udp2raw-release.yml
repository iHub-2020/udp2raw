# ==============================================================================
# GitHub Actions Workflow: Build and Release udp2raw (Rolling Release)
# Author: Reyanmatic (Modified for Fixed Versioning)
# 说明:
# 1. 同时编译 x86_64 和 aarch64 (R2S) 版本。
# 2. 【核心修改】无论何种触发方式，统一发布到固定 Tag: v0.0.0
# 3. 每次运行都会覆盖 v0.0.0 中的二进制文件，实现 Makefile 免修改。
# ==============================================================================

name: Build udp2raw Binaries

on:
  push:
    tags:
      - 'v*' 
    branches:
      - master
      - main
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write # 赋予写权限，以便发布 Release

jobs:
  build:
    name: Build for ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            compiler: g++
            output_name: udp2raw_x86_64
          - arch: aarch64
            compiler: aarch64-linux-gnu-g++
            output_name: udp2raw_aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            sudo apt-get install -y g++-aarch64-linux-gnu
          fi

      - name: Compile
        run: |
          # 清理旧的编译文件
          make clean
          
          # 编译 (强制使用静态链接，确保兼容 OpenWrt musl 环境)
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            # x86_64 静态编译
            make -j$(nproc) LDFLAGS=-static
            mv udp2raw ${{ matrix.output_name }}
          elif [ "${{ matrix.arch }}" = "aarch64" ]; then
            # aarch64 交叉编译 + 静态链接
            make CROSS=aarch64-linux-gnu- -j$(nproc) LDFLAGS=-static
            mv udp2raw ${{ matrix.output_name }}
          fi
          
          # 验证文件类型 (打印到日志中以便检查)
          file ${{ matrix.output_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: ${{ matrix.output_name }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 【修改点】强制设定固定版本号 v0.0.0
      # 这样 Makefile 里的 PKG_VERSION:=0.0.0 永远不用改
      - name: Set Fixed Tag
        id: tag
        run: |
          echo "release_tag=v0.0.0" >> $GITHUB_OUTPUT
          echo "is_prerelease=false" >> $GITHUB_OUTPUT

      # 更新 Release v0.0.0 (覆盖旧文件)
      # 注意：第一次运行前，GitHub 上可以没有 v0.0.0，它会自动创建。
      # 之后每次运行，它都会把新的二进制文件上传到这个 Tag 下。
      - name: Update Rolling Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: Rolling Release (Always Latest)
          body: "This is a rolling release. The binaries are always updated to the latest build.\n\nBuild Time: $(date)"
          prerelease: ${{ steps.tag.outputs.is_prerelease }}
          files: |
            artifacts/udp2raw_x86_64/udp2raw_x86_64
            artifacts/udp2raw_aarch64/udp2raw_aarch64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
